{% load static %}
<!doctype html>
<html lang="en" >
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Factify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'style.css'%}">
  </head>
  <body class="hum">
    <div class="container-fluid" style="text-align:center;background-color:#023047;display:flex;align-items:center;justify-content:center">
      <img src="{% static 'chirp.png'%}" class="img-fluid " alt="..." style="height:5rem;width:10rem" >
    </div>
    <nav class="navbar navbar-expand-lg" style="background-color:#708d81">
      <div class="container-fluid" style="background-color:#708d81">
        <a class="navbar-brand" href="{%url 'tweet_list'%}" style="font-size:1.5rem;font-weight:600">Factify</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent" style="background-color:#708d81">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0" style="background-color:#708d81">
           {% block btn %}
      
           {% endblock %}


            <li class="nav-item">
              {% comment %} <button type="button" class="btn btn-light m-2 hum1 hey" style="border-radius:50%">Light</button> {% endcomment %}
              <button class="hey" style="height:2.5rem;width:2.5rem;margin-top:0.3rem;margin-left:0.3rem;border-radius:50%;display:flex;align-items:center;justify:content:center"><img src="{% static 'bulb_close.png'%}" alt="" style="height:1.7rem;width:1.7rem;border-radius:50%;background-cover:contain;"></button>
            </li>
          </ul>
          <form class="d-flex" role="search" style="background-color:#708d81">
            <input class="form-control me-2 inp" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success searc" type="submit">Search</button>
          </form>
          {% if user.is_authenticated  %}
          <form action="{%url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="btn btn-danger m-2" type="submit">Logout</button>
          </form>
          <a class="btn btn-outline-primary" href="{% url 'profile' user.id %}" role="button">Profile</a>
          {% else %}
          <a class="btn btn-info m-2" href="{% url 'login' %}" role="button" style="color:white">Login</a>
          <a class="btn btn-warning" href="{% url 'register'%}" style="background-color:#008080;color:white;border:none;outline:none" role="button" >Register</a>
          {% endif  %}
        </div>
      </div>
    </nav>
    <style>
      .hey{
        background-color:white;
      }
      .hum {
        background-color: black;
        color:white;
      }
    
      .hum1 {
        background-color: white;
        color:black;
      }
    </style>
    <script>
      let btn1 = document.querySelector('.hey');
      let btn2 = document.querySelector('.hello');
      let mai = document.querySelector('body');
      
      console.log(mai);
      console.log(btn1);
      console.log(btn2);
      btn1.addEventListener('click', () => {
        // mai.classList.add('hum1');
        if (mai.classList.contains('hum')) {
          mai.classList.remove('hum');
          mai.classList.add('hum1');
          {% comment %} btn1.innerText = 'Dark'; {% endcomment %}
          {% comment %} btn1.classList.add('hum');
          btn1.classList.remove('hum1'); {% endcomment %}
          btn1.innerHTML='<img src="{% static 'bulb_open.png'%}" alt="" style="height:1.7rem;width:1.7rem;border-radius:50%;background-cover:contain;">'
        } else {
          mai.classList.remove('hum1');
          mai.classList.add('hum');
          {% comment %} btn1.innerText = 'Light'; {% endcomment %}
          {% comment %} btn1.classList.remove('hum');
          btn1.classList.add('hum1'); {% endcomment %}
          btn1.innerHTML='<img src="{% static 'bulb_close.png'%}" alt="" style="height:1.7rem;width:1.7rem;border-radius:50%;background-cover:contain;">'
        }
        // alert("hello");
      })
    </script>
    {% block  content%}
 
    {% endblock  %}
    <nav class="navbar absolute-bottom  p-0 mt-5" style="background-color:#023047;color:white;display:flex;align-items:center;justify-content:center">
      <div class="container-fluid p-0" style="background-color:#023047;color:white;display:flex;align-items:center;justify-content:center">
        <p>&copy;
          All Rights Reserved</p>
      </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
