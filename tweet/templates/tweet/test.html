<div class="card p-0 bg-dark ms-3" style="width: 18rem;" style="margin-top:2rem;padding:0;color:white">
  {% if tweet.photo %}
  <img src="{{tweet.photo.url}}" class="card-img-top" alt="..." style="height:10rem;object-fit:contain;background-color:#0d1321">
  {% else %}
  <img src="..." class="card-img-top" alt="..." style="height:10rem;object-fit:contain;background-color:#0d1321">
  {% endif  %}
  <div class="card-body bg-dark" style="text-align:start;padding:0;color:white" >
    <h5 class="card-title m-3 w-auto p-2 rounded" style="font-weight:700;border:0.2px white solid;background-color:#006d77;text-align:start">{{tweet.user.username}}</h5>
    <p class="card-text m-3" style="height:13rem">{{tweet.Text}}</p>
    {% if tweet.user == user  %}
    <a href="{% url 'tweet_edit' tweet.id %}" class="btn btn-success m-3 ps-3 pe-3">Edit</a>
    <a href="{% url 'tweet_delete' tweet.id %}" class="btn btn-danger">Delete</a>
    {% endif  %}
  </div>
</div>
